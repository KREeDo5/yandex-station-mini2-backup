# AI-generated CI configuration. Review before use. See AI_DISCLOSURE.md.
# Local unit tests only. No device access, no real IPs, no secrets.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run local unit tests
        run: python -m unittest discover -s tests -t . -v
